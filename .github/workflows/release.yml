name: Release
on:
  push:
    branches: ["dev", "master"]
# A called workflow cannot exceed the caller's permissions.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
# One release per branch at a time: a second push waits, so its version is computed after the first one is tagged.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: PanoMC/sdk/.github/workflows/theme-release.yml@6b8e3f079f66c68ca5deab6553f7a4dc68ad55ac # dev; a commit, not the moving branch
    with:
      theme-id: banana-theme
    secrets:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
